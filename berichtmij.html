<!DOCTYPE html>
<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <meta name="description" content="Direct bericht sturen naar Jelle van Uffelen">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssfolder/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <nav aria-label="Hoofdmenu">
        <a href="index.html" class="knop">Home</a>
        <a href="overmij.html" class="knop">Over mij</a>
        <a href="projecten.html" class="knop">Projecten</a>
        <a href="blogs.html" class="knop">Blog</a>
        <a href="berichtmij.html" class="knop">Contact</a>
      </nav>
    </header>

    <main>
      <section class="blurb">
        <div class="pageHeader">
          <h1>Contact</h1>
        </div>
      </section>

      <form id="contact-form" novalidate>
        <section class="formTop">
          <div class="veld">
            <label for="naam">Naam</label>
            <input type="text" id="naam" name="naam" required minlength="2" autocomplete="name">
            <p class="veld-fout" id="naam-error" aria-live="polite"></p>
          </div>

          <div class="veld">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <p class="veld-fout" id="email-error" aria-live="polite"></p>
          </div>
        </section>

        <section class="formBottom">
          <div class="veld">
            <label for="bericht">Bericht</label>
            <textarea id="bericht" name="bericht" class="bericht" required minlength="20"></textarea>
            <p class="veld-fout" id="bericht-error" aria-live="polite"></p>
          </div>

          <button type="submit" id="submit">Versturen</button>
        </section>

        <p id="form-success" class="form-success" aria-live="polite"></p>
      </form>
    </main>

    <footer>
      <p>© 2026 Jelle van Uffelen</p>
    </footer>

    <script src="javascriptfolder/contact.js"></script>
  </body>
</html>

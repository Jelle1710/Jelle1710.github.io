<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <title>Projecten</title>
    <meta name="description" content="Overzicht van mijn projecten">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssfolder/style.css">
  </head>
  <body>
    <header>
      <nav aria-label="Hoofdmenu">
        <a href="index.html" class="knop">Home</a>
        <a href="overmij.html" class="knop">Over mij</a>
        <a href="projecten.html" class="knop">Projecten</a>
        <a href="blogs.html" class="knop">Blog</a>
        <a href="berichtmij.html" class="knop">Contact</a>
      </nav>
    </header>

    <main>
      <section class="projecten-section">
        <div class="projecten-tekst">
          <h1>Projecten</h1>
          <p>Hieronder staan mijn projecten. Je kunt ze filteren op categorie of zoeken op naam.</p>
        </div>
      </section>

      <section class="project-filters" aria-label="Projectfilters">
        <label for="project-zoek">Zoeken</label>
        <input type="search" id="project-zoek" placeholder="Zoek op projectnaam of beschrijving">

        <label for="project-categorie">Categorie</label>
        <select id="project-categorie">
          <option value="alle">Alle categorieën</option>
          <option value="school">School</option>
          <option value="web">Web</option>
          <option value="game">Game</option>
        </select>
      </section>

      <p id="project-status" class="status" aria-live="polite"></p>
      <section id="project-grid" class="project-grid"></section>
    </main>

    <footer>
      <p>© 2026 Jelle van Uffelen</p>
    </footer>

    <script src="javascriptfolder/projecten.js"></script>
  </body>
</html>
